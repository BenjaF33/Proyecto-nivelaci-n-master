<body>
    <h3>Crear cuenta</h3>
    <p>Completa tus datos para registrarte</p>

    <form action="/registro" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="tu@email.com" required>

        <label for="contraseña">Contraseña</label>
        <input type="password" id="contraseña" placeholder="********" required>

        <label for="confirmar-contraseña">Confirmar contraseña</label>
        <input type="password" id="confirmar-contraseña" placeholder="********" required>

        <button type="submit">Registrarse</button>
    </form>
    <p>o continua con</p>

    <button>Google</button>
    <button>Facebook</button>
    <p>¿Ya tienes una cuenta? <a routerLink='/inicio-sesion'>Inicia sesión</a></p>

</body>
